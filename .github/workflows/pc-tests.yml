name: Tests and Native Builds

on:
  push:
    branches:
      - master
      - "chatgpt/**"
  pull_request:
    branches:
      - master

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pc

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 PC 侧测试
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/generate_tool_catalog.py --check

  tracer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: m5/tracer

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 运行 M5 Tracer 单元测试并编译 APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: 上传 Tracer APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ReconBridge-Tracer-debug
          path: m5/tracer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  daemon-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查 daemon 动态层 C++ 语法
        run: |
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/dynamic.cpp
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/mobile_mcp.cpp

      - name: 验证事件序号、截断、重启与并发
        run: |
          g++ -std=c++17 -pthread -Isrc tests/event_stream_test.cpp -o /tmp/event-stream-test
          /tmp/event-stream-test
          g++ -std=c++17 -Isrc -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" tests/jni_observer_test.cpp -o /tmp/jni-observer-test
          /tmp/jni-observer-test
          g++ -std=c++17 -shared -fPIC tests/jni_exports_fixture.cpp -o /tmp/jni-exports-fixture.so
          g++ -std=c++17 -pthread tests/jni_mappings_test.cpp -o /tmp/jni-mappings-test
          /tmp/jni-mappings-test /tmp/jni-exports-fixture.so
          g++ -std=c++17 -pthread tests/native_status_test.cpp -o /tmp/native-status-test
          /tmp/native-status-test
          g++ -std=c++17 -pthread tests/native_live_test.cpp -o /tmp/native-live-test
          /tmp/native-live-test
          g++ -std=c++17 -pthread -Isrc tests/native_ipc_test.cpp -o /tmp/native-ipc-test
          /tmp/native-ipc-test

  native-abi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute production scalar ABI gateways on native CPU
        run: |
          g++ -std=c++17 -O2 -pthread tests/native_abi_test.cpp m3/zygisk/native_bridge.S -o /tmp/native-abi-test
          /tmp/native-abi-test

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装固定版本 NDK r27c
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: 从源码编译 daemon 与 Zygisk
        run: python scripts/build_native.py --abi "${{ matrix.abi }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.abi }}
          path: build/native/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 14

  module-package:
    needs: [pytest, tracer, daemon-syntax, native-abi, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: native-arm64-v8a
          path: build/native/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64
          path: build/native/x86_64
      - name: 打包并核对源码指纹、ELF 架构、哈希与 ZIP 路径
        run: |
          python scripts/package_module.py --output dist/ReconBridge-CI.zip
          python scripts/package_module.py --verify dist/ReconBridge-CI.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReconBridge-module-verified
          path: dist/ReconBridge-CI.zip
          if-no-files-found: error
          retention-days: 14

